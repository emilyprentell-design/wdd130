<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us| Whitewater Rafting</title>
    <meta name="description" content="All your question we can resolve">
    <meta name="author" content="Emily Prentell">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo-rafting.jpg" alt="Logo Rafting">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a> </li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Contact us</h1>
        <div class="contact-layout">

            <addressv class="contact-info">
                <h2>Whitewater Rafting</h2>
                123 Main River Street<br>
                White Water Rafting<br>
                Phone: <a href="tel:586-472-454">586-472-454</a><br>
                Email: <a href="mailto:info@rafting.com">info@rafting.com</a><br>
            </addressv>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d401417.92086784856!2d14.822680795828093!3d60.66017359599217!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sse!4v1780936237235!5m2!1ses-419!2sse"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <section class="contact-form">
                <h2>Send Us a Message</h2>
                <form action="#">
                    <div class="form-item">
                        <label for=" name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                    <div class="radio-group">
                        <legend>Purpose of Message</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general"
                              required>
                            <label for="general">General Inquiry</label>

                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>

                            <input type="radio" id="website" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                    <div class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>


                    <button type="submit">Get in Touch!</button>
                </form>

            </section>
        </div>


        <div>
            <section class="staff">
                <h2>We Are Here to Serve You</h2>
                <figure>
                    <img src="images/operation.jfif" alt="Operation Manager">
                    <figcaption>Josue Brozovich - Operation Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/customer.jfif" alt="Customer">
                    <figcaption>Emily Prentell - Customer Support Specialist</figcaption>
                </figure>

                <figure>
                    <img src="images/Instructor.jfif" alt="Instructor">
                    <figcaption>Jonathan Prentell - Instructor</figcaption>
                </figure>
            </section>
        </div>


    </main>
    <footer>
        <p>© 2026 The Whitewater Rafting</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jfif" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
